spring.application.name=ollamai

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:e2b
spring.ai.ollama.embedding.options.model=embeddinggemma:300m
# Agent Determinism (0.2 temperature is great for tool calling stability)
spring.ai.ollama.chat.options.temperature=0.2

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# SQL Initialization (Keep 'always' if you want schema.sql/data.sql to run every startup)
spring.sql.init.mode=always
spring.ai.vectorstore.pgvector.initialize-schema=false